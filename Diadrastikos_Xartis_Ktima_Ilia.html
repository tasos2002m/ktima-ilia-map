  var map = L.map('map');

  // υποβαθρο, ΔΩΡΕΑΝ, ΧΩΡΙΣ κανενα API key/account (δημοσια REST υπηρεσια
  // της Esri, διαφορετικο απο το ArcGIS Online hosted content που θα
  // χρειαζοταν login - συμβατο με "Leaflet, χωρις λογαριασμο"). Πανω απο
  // αυτο, ενα δευτερο, ημι-διαφανες layer με ονοματα δρομων/τοποθεσιων
  // (Esri Reference), ωστε να μοιαζει με "δορυφορικο + ετικετες" (οπως
  // το satellite/hybrid mode στο Google/Apple Maps).
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics'
  }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      opacity: 0.9,

  }).addTo(map);

  function rowHtml(label, value) {
    return '<tr><td>' + label + '</td><td>' + value + '</td></tr>';
  }

  var layer = L.geoJSON(geojsonData, {
    style: function (feature) {
      return { color: '#333', weight: 1.5, fillColor: feature.properties.color, fillOpacity: 0.55 };
    },
    onEachFeature: function (feature, lyr) {
      var p = feature.properties;
      // PROSTHIKI (2026-09-15, §72): "Καταλληλότητα"/"Χρειάζεται Έλεγχο;"/
      // "Υγρασία Εδάφους"/"Ανάγκη Νερού" αφαιρέθηκαν απο εδώ (Τάσος: "μηπως
      // ειναι υπερβολικα πολλα στοιχεια") - μένουν μόνο στο Excel. Η
      // Καταλληλότητα παραμένει ορατή μέσω του χρωματισμού πολυγώνου.
      var html = '<b>ΚΑΕΚ ' + p.KAEK + '</b><table class="popup-table">'

  }).addTo(map);
